<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subs — Log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B7A57}a:hover{color:#075A40}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; color: #14171C; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 72px 24px 32px; gap: 32px">
  <div style="display: flex; flex-direction: column; gap: 16px">
    <div style="width: 56px; height: 56px; border-radius: 18px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg>
    </div>
    <h1 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-weight: 800; font-size: 32px; line-height: 1.15">Know what you pay for.</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #5B6370">Track every subscription and get reminded before it renews.</p>
  </div>

  <form style="display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="login-email" style="font-size: 13px; font-weight: 500; color: #5B6370">Email</label>
      <input id="login-email" type="email" value="ana@example.com" style="height: 48px; box-sizing: border-box; border: 1px solid #E3E6EA; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font: 400 16px Inter, sans-serif; color: #14171C">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="login-password" style="font-size: 13px; font-weight: 500; color: #5B6370">Password</label>
      <input id="login-password" type="password" value="password123" style="height: 48px; box-sizing: border-box; border: 1px solid #E3E6EA; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font: 400 16px Inter, sans-serif; color: #14171C">
    </div>
    <a href="Dashboard.dc.html" style="height: 52px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font: 600 16px Inter, sans-serif; margin-top: 8px; display: flex; align-items: center; justify-content: center; text-decoration: none">Log in</a>
    <a href="#" style="align-self: center; font-size: 15px; font-weight: 500; padding: 10px">Forgot password?</a>
  </form>

  <div style="margin-top: auto; display: flex; justify-content: center; gap: 6px; font-size: 15px; color: #5B6370">
    <span>No account yet?</span><a href="Register.dc.html" style="font-weight: 600">Create one</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B7A57","options":["#0B7A57","#2F5BD3","#C2410C","#14171C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0B7A57' };
  }
}
</script>
</body>
</html>
