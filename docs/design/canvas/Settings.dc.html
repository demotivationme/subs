<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subs — Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.num{font-variant-numeric:tabular-nums}
a{color:#0B7A57}a:hover{color:#075A40}
</style>
</helmet>
<div style="width: 390px; height: 1140px; box-sizing: border-box; background: #F5F6F8; color: #14171C; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 24px 20px 12px">
    <h1 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: 28px">Settings</h1>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 0 20px 20px; display: flex; flex-direction: column; gap: 20px">
    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5B6370">Reminders</h2>
      <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
        <a href="DefaultReminders.dc.html" style="min-height: 68px; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #EEF0F3; color: #14171C; text-decoration: none">
          <span style="width: 40px; height: 40px; border-radius: 12px; background: #E2F3EB; color: #0B7A57; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 16px">Default reminders</span><span style="font-size: 13px; color: #5B6370">1 day before at 09:00 · Push, In-app</span></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6370" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
        </a>
        <div style="min-height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px">
          <span id="push-label" style="font-size: 16px">Push notifications on this device</span>
          <button type="button" role="switch" aria-checked="true" aria-labelledby="push-label" style="width: 52px; height: 32px; border: 0; border-radius: 16px; background: {{accent}}; padding: 3px; display: flex; justify-content: flex-end; flex: none"><span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(20,23,28,0.2)"></span></button>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5B6370">Profile</h2>
      <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
        <button type="button" style="width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border: 0; border-bottom: 1px solid #EEF0F3; background: #FFFFFF; font: 400 16px Inter, sans-serif; color: #14171C"><span>Name</span><span style="color: #5B6370">Ana</span></button>
        <button type="button" style="width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border: 0; border-bottom: 1px solid #EEF0F3; background: #FFFFFF; font: 400 16px Inter, sans-serif; color: #14171C"><span>Main currency</span><span style="color: #5B6370">EUR</span></button>
        <button type="button" style="width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border: 0; border-bottom: 1px solid #EEF0F3; background: #FFFFFF; font: 400 16px Inter, sans-serif; color: #14171C"><span>Language</span><span style="color: #5B6370">English</span></button>
        <button type="button" style="width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border: 0; background: #FFFFFF; font: 400 16px Inter, sans-serif; color: #14171C"><span>Timezone</span><span style="color: #5B6370">Europe/Berlin</span></button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5B6370">Account</h2>
      <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
        <div style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #EEF0F3"><span style="font-size: 16px">ana@example.com</span><span style="font-size: 12px; font-weight: 600; color: #0B7A57; background: #E2F3EB; border-radius: 999px; padding: 3px 10px">Verified</span></div>
        <button type="button" style="width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border: 0; border-bottom: 1px solid #EEF0F3; background: #FFFFFF; font: 400 16px Inter, sans-serif; color: #14171C"><span>Manage categories</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6370" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
        <button type="button" style="width: 100%; min-height: 52px; display: flex; align-items: center; padding: 0 16px; border: 0; background: #FFFFFF; font: 500 16px Inter, sans-serif; color: #14171C">Log out</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #B42F25">Danger zone</h2>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
        <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5B6370">This permanently deletes your account and all your subscriptions.</p>
        <label for="del-pass" style="font-size: 13px; font-weight: 500; color: #5B6370">Confirm with your password</label>
        <input id="del-pass" type="password" style="height: 48px; box-sizing: border-box; border: 1px solid #E3E6EA; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font: 400 16px Inter, sans-serif">
        <button type="button" disabled style="height: 48px; border: 0; border-radius: 12px; background: #B42F25; color: #FFFFFF; font: 600 16px Inter, sans-serif; opacity: 0.45">Delete my account</button>
      </div>
    </section>
  </main>

  <nav aria-label="Main" style="display: flex; background: #FFFFFF; border-top: 1px solid #E3E6EA; padding: 6px 8px 22px">
    <a href="Dashboard.dc.html" style="flex: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6370; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3v9z"></path><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"></path></svg>Dashboard</a>
    <a href="Subscriptions.dc.html" style="flex: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6370; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>Subscriptions</a>
    <a href="Inbox.dc.html" style="flex: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5B6370; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"></path></svg>Inbox</a>
    <a href="Settings.dc.html" aria-current="page" style="flex: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{accent}}; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B7A57","options":["#0B7A57","#2F5BD3","#C2410C","#14171C"]},"$preview":{"width":390,"height":1140}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0B7A57' };
  }
}
</script>
</body>
</html>
