<!doctype html>
<html lang="en">
<head>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.num{font-variant-numeric:tabular-nums}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; color: #14171C; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 12px; padding: 16px 12px 0 20px">
    <div role="progressbar" aria-label="Step 1 of 3" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1" style="flex: 1; display: flex; gap: 6px">
      <span style="flex: 1; height: 4px; border-radius: 2px; background: {{accent}}"></span>
      <span style="flex: 1; height: 4px; border-radius: 2px; background: #D5D9DF"></span>
      <span style="flex: 1; height: 4px; border-radius: 2px; background: #D5D9DF"></span>
    </div>
    <a href="Subscriptions.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #5B6370"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
  </header>

  <main style="flex: 1; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 18px">
    <h1 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-weight: 800; font-size: 28px; line-height: 1.15">What are you paying for?</h1>

    <div style="position: relative; display: flex">
      <label for="svc-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search services</label>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6370" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 16px; top: 16px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="svc-search" placeholder="Search or type a name" style="flex: 1; height: 52px; box-sizing: border-box; border: 0; border-radius: 16px; background: #FFFFFF; padding: 0 16px 0 46px; font: 400 17px Inter, sans-serif; color: #14171C; box-shadow: 0 1px 2px rgba(20,23,28,0.06)">
    </div>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5B6370">Popular</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <a href="NewSub2.dc.html" style="background: #FFFFFF; border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #14171C"><dc-import name="ServiceIcon" brand="netflix" size="44" hint-size="44px,44px"></dc-import><span style="font-size: 13px; font-weight: 600">Netflix</span></a>
        <a href="NewSub2.dc.html" style="background: #FFFFFF; border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #14171C; box-shadow: 0 0 0 2px {{accent}}"><dc-import name="ServiceIcon" brand="spotify" size="44" hint-size="44px,44px"></dc-import><span style="font-size: 13px; font-weight: 600">Spotify</span></a>
        <a href="NewSub2.dc.html" style="background: #FFFFFF; border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #14171C"><dc-import name="ServiceIcon" brand="youtube" size="44" hint-size="44px,44px"></dc-import><span style="font-size: 13px; font-weight: 600">YouTube</span></a>
        <a href="NewSub2.dc.html" style="background: #FFFFFF; border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #14171C"><span style="width: 44px; height: 44px; border-radius: 14px; background: #E6EEFA; color: #1E4FA8; display: flex; align-items: center; justify-content: center; font: 800 18px Manrope, sans-serif">D</span><span style="font-size: 13px; font-weight: 600">Disney+</span></a>
        <a href="NewSub2.dc.html" style="background: #FFFFFF; border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #14171C"><dc-import name="ServiceIcon" brand="icloud" size="44" hint-size="44px,44px"></dc-import><span style="font-size: 13px; font-weight: 600">iCloud+</span></a>
        <a href="NewSub2.dc.html" style="background: #FFFFFF; border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #14171C"><dc-import name="ServiceIcon" brand="applemusic" size="44" hint-size="44px,44px"></dc-import><span style="font-size: 13px; font-weight: 600">Apple Music</span></a>
        <a href="NewSub2.dc.html" style="background: #FFFFFF; border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #14171C"><span style="width: 44px; height: 44px; border-radius: 14px; background: #EEF0F3; color: #14171C; display: flex; align-items: center; justify-content: center; font: 800 18px Manrope, sans-serif">A</span><span style="font-size: 13px; font-weight: 600">Amazon Prime</span></a>
        <a href="NewSub2.dc.html" style="background: #FFFFFF; border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #14171C"><dc-import name="ServiceIcon" brand="playstation" size="44" hint-size="44px,44px"></dc-import><span style="font-size: 13px; font-weight: 600">PS Plus</span></a>
        <a href="NewSub2.dc.html" style="background: #FFFFFF; border-radius: 16px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #14171C"><dc-import name="ServiceIcon" brand="max" size="44" hint-size="44px,44px"></dc-import><span style="font-size: 13px; font-weight: 600">Max</span></a>
      </div>
    </section>

    <a href="NewSubCustom.dc.html" style="min-height: 52px; border: 1.5px dashed #D5D9DF; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Not listed? Add your own service</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B7A57","options":["#0B7A57","#2F5BD3","#C2410C","#14171C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0B7A57' };
  }
}
</script>
</body>
</html>
