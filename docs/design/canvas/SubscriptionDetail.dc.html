<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subs — Netflix</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.num{font-variant-numeric:tabular-nums}
a{color:#0B7A57}a:hover{color:#075A40}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #F5F6F8; color: #14171C; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 4px; padding: 16px 12px 4px">
    <a href="Subscriptions.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #14171C">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <span style="font-size: 15px; font-weight: 500; color: #5B6370">Subscriptions</span>
  </header>

  <main style="flex: 1; padding: 4px 20px 24px; display: flex; flex-direction: column; gap: 16px">
    <section style="display: flex; align-items: center; gap: 14px">
      <dc-import name="ServiceIcon" brand="netflix" size="56" hint-size="56px,56px"></dc-import>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: 26px">Netflix</h1>
        <span style="font-size: 14px; color: #5B6370">Video Streaming · Active</span>
      </div>
    </section>

    <section style="background: #FFFFFF; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: baseline; gap: 8px">
        <span class="num" style="font-family: Manrope, Inter, sans-serif; font-weight: 800; font-size: 36px">€12.99</span>
        <span style="font-size: 15px; color: #5B6370">monthly</span>
      </div>
      <span class="num" style="font-size: 14px; color: #5B6370">€155.88 per year</span>
      <dl style="margin: 12px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 12px; color: #5B6370">Next payment</dt><dd class="num" style="margin: 0; font-weight: 600">Nov 5, 2026</dd></div>
        <div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 12px; color: #5B6370">First payment</dt><dd class="num" style="margin: 0; font-weight: 600">Jan 5, 2025</dd></div>
      </dl>
    </section>

    <section style="background: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: #5B6370">Notes</span>
      <p style="margin: 0; font-size: 15px; line-height: 1.5">Family plan, shared with Max</p>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: 17px">Reminders</h2>
        <button type="button" style="height: 36px; border: 0; background: transparent; color: {{accent}}; font: 600 14px Inter, sans-serif; padding: 0 4px">Customize</button>
      </div>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; gap: 12px; align-items: center">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: #E2F3EB; color: #0B7A57; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M5 3 2 6M22 6l-3-3"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">1 day before at 09:00</span><span style="font-size: 13px; color: #5B6370">Push · In-app · using your defaults</span></div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px">
      <button type="button" style="height: 48px; border: 0; border-radius: 12px; background: #14171C; color: #FFFFFF; font: 600 16px Inter, sans-serif">Edit</button>
      <div style="display: flex; gap: 10px">
        <button type="button" style="flex: 1; height: 48px; border: 1px solid #E3E6EA; border-radius: 12px; background: #FFFFFF; color: #14171C; font: 600 15px Inter, sans-serif">Pause</button>
        <button type="button" style="flex: 1; height: 48px; border: 1px solid #E3E6EA; border-radius: 12px; background: #FFFFFF; color: #14171C; font: 600 15px Inter, sans-serif">Mark as cancelled</button>
      </div>
      <button type="button" style="height: 48px; border: 0; border-radius: 12px; background: transparent; color: #B42F25; font: 600 15px Inter, sans-serif">Delete subscription</button>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B7A57","options":["#0B7A57","#2F5BD3","#C2410C","#14171C"]},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0B7A57' };
  }
}
</script>
</body>
</html>
