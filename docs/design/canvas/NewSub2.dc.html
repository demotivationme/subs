<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subs — Add subscription: price</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.num{font-variant-numeric:tabular-nums}
a{color:#0B7A57}a:hover{color:#075A40}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; color: #14171C; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 4px; padding: 16px 12px 0 8px">
    <a href="NewSub1.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #5B6370"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <div role="progressbar" aria-label="Step 2 of 3" aria-valuemin="1" aria-valuemax="3" aria-valuenow="2" style="flex: 1; display: flex; gap: 6px">
      <span style="flex: 1; height: 4px; border-radius: 2px; background: {{accent}}"></span>
      <span style="flex: 1; height: 4px; border-radius: 2px; background: {{accent}}"></span>
      <span style="flex: 1; height: 4px; border-radius: 2px; background: #D5D9DF"></span>
    </div>
    <a href="Subscriptions.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #5B6370"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
  </header>

  <main style="flex: 1; padding: 8px 20px 16px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 10px">
      <dc-import name="ServiceIcon" brand="spotify" size="36" hint-size="36px,36px"></dc-import>
      <span style="font-weight: 700; font-size: 17px">Spotify</span>
      <a href="NewSub1.dc.html" style="margin-left: auto; font-size: 14px; font-weight: 600; text-decoration: none; padding: 10px 4px">Change</a>
    </div>

    <h1 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-weight: 800; font-size: 28px; line-height: 1.15">How much is it?</h1>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 18px; display: flex; align-items: center; gap: 12px">
      <label for="amt" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Amount</label>
      <span style="font: 800 40px Manrope, sans-serif; color: #5B6370">€</span>
      <input id="amt" class="num" value="10,99" inputmode="decimal" style="flex: 1; min-width: 0; border: 0; padding: 0; background: transparent; font: 800 44px Manrope, sans-serif; color: #14171C">
      <button type="button" style="height: 40px; border: 0; border-radius: 999px; background: #EEF0F3; padding: 0 12px; font: 600 15px Inter, sans-serif; color: #14171C; display: flex; align-items: center; gap: 4px">EUR<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; color: #5B6370">Billed</span>
      <div role="radiogroup" aria-label="Billed" style="display: flex; background: #EEF0F3; border-radius: 14px; padding: 4px; gap: 4px">
        <button type="button" role="radio" aria-checked="false" style="flex: 1; height: 42px; border: 0; border-radius: 10px; background: transparent; font: 500 15px Inter, sans-serif; color: #14171C">Weekly</button>
        <button type="button" role="radio" aria-checked="true" style="flex: 1; height: 42px; border: 0; border-radius: 10px; background: #FFFFFF; font: 600 15px Inter, sans-serif; color: #14171C; box-shadow: 0 1px 2px rgba(20,23,28,0.08)">Monthly</button>
        <button type="button" role="radio" aria-checked="false" style="flex: 1; height: 42px; border: 0; border-radius: 10px; background: transparent; font: 500 15px Inter, sans-serif; color: #14171C">Yearly</button>
      </div>
      <button type="button" style="align-self: flex-start; min-height: 36px; border: 0; background: transparent; padding: 0; font: 500 14px Inter, sans-serif; color: {{accent}}">Billed every few months?</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; color: #5B6370">Next payment</span>
      <div style="display: flex; gap: 8px">
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border: 1px solid #E3E6EA; border-radius: 999px; background: #FFFFFF; font: 500 14px Inter, sans-serif; color: #14171C">Today</button>
        <button type="button" aria-pressed="false" style="height: 40px; padding: 0 14px; border: 1px solid #E3E6EA; border-radius: 999px; background: #FFFFFF; font: 500 14px Inter, sans-serif; color: #14171C">Tomorrow</button>
        <button type="button" aria-pressed="true" style="height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #14171C; font: 500 14px Inter, sans-serif; color: #FFFFFF; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg><span class="num">Nov 11</span></button>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
      <button type="button" style="width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border: 0; border-bottom: 1px solid #EEF0F3; background: #FFFFFF; font: 400 15px Inter, sans-serif; color: #14171C"><span style="color: #5B6370">Category</span><span style="display: flex; align-items: center; gap: 6px; font-weight: 600">Music<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6370" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span></button>
      <button type="button" style="width: 100%; min-height: 52px; display: flex; align-items: center; padding: 0 16px; border: 0; background: #FFFFFF; font: 500 15px Inter, sans-serif; color: {{accent}}">+ Add a note</button>
    </div>
  </main>

  <footer style="padding: 12px 20px 30px">
    <a href="NewSub3.dc.html" style="height: 54px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Continue</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B7A57","options":["#0B7A57","#2F5BD3","#C2410C","#14171C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0B7A57' };
  }
}
</script>
</body>
</html>
