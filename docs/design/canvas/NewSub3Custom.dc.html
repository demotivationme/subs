<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subs — Add subscription: reminders (custom)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.num{font-variant-numeric:tabular-nums}
a{color:#0B7A57}a:hover{color:#075A40}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; color: #14171C; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 4px; padding: 16px 12px 0 8px">
    <a href="NewSub2.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #5B6370"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <div role="progressbar" aria-label="Step 3 of 3" aria-valuemin="1" aria-valuemax="3" aria-valuenow="3" style="flex: 1; display: flex; gap: 6px">
      <span style="flex: 1; height: 4px; border-radius: 2px; background: {{accent}}"></span>
      <span style="flex: 1; height: 4px; border-radius: 2px; background: {{accent}}"></span>
      <span style="flex: 1; height: 4px; border-radius: 2px; background: {{accent}}"></span>
    </div>
    <a href="Subscriptions.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #5B6370"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
  </header>

  <main style="flex: 1; padding: 8px 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-weight: 800; font-size: 28px; line-height: 1.15">Remind you before it renews?</h1>

    <div style="background: #FFFFFF; border-radius: 20px; overflow: hidden">
      <div style="min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: #E2F3EB; color: #0B7A57; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></span>
        <span id="remind-label-c" style="flex: 1; font-weight: 600; font-size: 17px">Remind me</span>
        <button type="button" role="switch" aria-checked="true" aria-labelledby="remind-label-c" style="width: 52px; height: 32px; border: 0; border-radius: 16px; background: {{accent}}; padding: 3px; display: flex; justify-content: flex-end; flex: none"><span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(20,23,28,0.2)"></span></button>
      </div>

      <div style="border-top: 1px solid #EEF0F3; padding: 16px; display: flex; flex-direction: column; gap: 16px">
        <div role="radiogroup" aria-label="Reminder settings" style="display: flex; background: #EEF0F3; border-radius: 12px; padding: 4px; gap: 4px">
          <a href="NewSub3.dc.html" role="radio" aria-checked="false" style="flex: 1; height: 40px; border-radius: 9px; font: 500 15px Inter, sans-serif; color: #14171C; display: flex; align-items: center; justify-content: center; text-decoration: none">My default</a>
          <a href="NewSub3Custom.dc.html" role="radio" aria-checked="true" style="flex: 1; height: 40px; border-radius: 9px; background: #FFFFFF; font: 600 15px Inter, sans-serif; color: #14171C; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 1px 2px rgba(20,23,28,0.08)">Custom</a>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; font-weight: 600; color: #5B6370">When</span>
          <div style="display: flex; gap: 6px; flex-wrap: wrap">
            <button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border: 1px solid #E3E6EA; border-radius: 999px; background: #FFFFFF; font: 500 14px Inter, sans-serif; color: #14171C">On the day</button>
            <button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border: 1px solid #E3E6EA; border-radius: 999px; background: #FFFFFF; font: 500 14px Inter, sans-serif; color: #14171C">1 day</button>
            <button type="button" aria-pressed="true" style="height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: #14171C; font: 500 14px Inter, sans-serif; color: #FFFFFF">3 days</button>
            <button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border: 1px solid #E3E6EA; border-radius: 999px; background: #FFFFFF; font: 500 14px Inter, sans-serif; color: #14171C">7 days</button>
            <button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border: 1px solid #E3E6EA; border-radius: 999px; background: #FFFFFF; font: 500 14px Inter, sans-serif; color: #14171C">Other…</button>
          </div>
          <span style="font-size: 13px; color: #5B6370">before the payment</span>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="font-size: 13px; font-weight: 600; color: #5B6370">At</span>
          <button type="button" style="height: 40px; border: 1px solid #E3E6EA; border-radius: 12px; background: #FFFFFF; padding: 0 12px; font: 600 16px Inter, sans-serif; color: #14171C; display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6370" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span class="num">18:00</span></button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 13px; font-weight: 600; color: #5B6370; margin-bottom: 4px">How</span>
          <div style="min-height: 48px; display: flex; align-items: center; gap: 10px">
            <span id="ch-push" style="flex: 1; font-size: 15px">Push notification</span>
            <button type="button" role="switch" aria-checked="true" aria-labelledby="ch-push" style="width: 46px; height: 28px; border: 0; border-radius: 14px; background: {{accent}}; padding: 3px; display: flex; justify-content: flex-end; flex: none"><span style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF"></span></button>
          </div>
          <div style="min-height: 48px; display: flex; align-items: center; gap: 10px">
            <span id="ch-inapp" style="flex: 1; font-size: 15px">In-app inbox</span>
            <button type="button" role="switch" aria-checked="false" aria-labelledby="ch-inapp" style="width: 46px; height: 28px; border: 0; border-radius: 14px; background: #D5D9DF; padding: 3px; display: flex; flex: none"><span style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF"></span></button>
          </div>
          <div style="min-height: 48px; display: flex; align-items: center; gap: 10px">
            <span id="ch-email" style="flex: 1; font-size: 15px; display: flex; flex-direction: column; gap: 2px">Email<span style="font-size: 12px; color: #5B6370">ana@example.com</span></span>
            <button type="button" role="switch" aria-checked="true" aria-labelledby="ch-email" style="width: 46px; height: 28px; border: 0; border-radius: 14px; background: {{accent}}; padding: 3px; display: flex; justify-content: flex-end; flex: none"><span style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF"></span></button>
          </div>
        </div>

        <button type="button" style="align-self: flex-start; min-height: 40px; border: 0; background: transparent; padding: 0; font: 600 14px Inter, sans-serif; color: {{accent}}">+ Add another reminder</button>
      </div>
    </div>
  </main>

  <footer style="padding: 12px 20px 30px">
    <a href="Dashboard.dc.html" style="height: 54px; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Save subscription</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B7A57","options":["#0B7A57","#2F5BD3","#C2410C","#14171C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0B7A57' };
  }
}
</script>
</body>
</html>
