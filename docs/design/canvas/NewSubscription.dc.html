<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Subs — New subscription</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.num{font-variant-numeric:tabular-nums}
a{color:#0B7A57}a:hover{color:#075A40}
</style>
</helmet>
<div style="width: 390px; height: 1180px; box-sizing: border-box; background: #F5F6F8; color: #14171C; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 12px 8px 20px; background: #FFFFFF; border-bottom: 1px solid #E3E6EA">
    <h1 style="margin: 0; font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: 20px">New subscription</h1>
    <a href="Subscriptions.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #5B6370">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </a>
  </header>

  <form style="flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 24px">
    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; display: flex; align-items: center; gap: 10px; font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: 17px"><span style="width: 24px; height: 24px; border-radius: 12px; background: #14171C; color: #FFFFFF; font: 700 13px Inter, sans-serif; display: flex; align-items: center; justify-content: center">1</span>Service</h2>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="svc" style="font-size: 13px; font-weight: 500; color: #5B6370">Search or type a service name</label>
        <div style="position: relative; display: flex">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6370" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 14px; top: 15px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input id="svc" value="net" style="flex: 1; height: 48px; box-sizing: border-box; border: 1.5px solid {{accent}}; border-radius: 12px; background: #FFFFFF; padding: 0 14px 0 40px; font: 400 16px Inter, sans-serif; color: #14171C">
        </div>
      </div>
      <div style="background: #FFFFFF; border-radius: 14px; overflow: hidden; border: 1px solid #E3E6EA">
        <button type="button" style="width: 100%; min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border: 0; border-bottom: 1px solid #E3E6EA; background: #FFFFFF; font: 500 15px Inter, sans-serif; color: #14171C; text-align: left"><span style="width: 28px; height: 28px; border-radius: 8px; background: #E2F3EB; color: #0B7A57; display: flex; align-items: center; justify-content: center; font: 700 13px Manrope, sans-serif">N</span>Netflix</button>
        <button type="button" style="width: 100%; min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border: 0; border-bottom: 1px solid #E3E6EA; background: #FFFFFF; font: 500 15px Inter, sans-serif; color: #14171C; text-align: left"><span style="width: 28px; height: 28px; border-radius: 8px; background: #EEF0F3; color: #14171C; display: flex; align-items: center; justify-content: center; font: 700 13px Manrope, sans-serif">N</span>Nebula</button>
        <button type="button" style="width: 100%; min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 14px; border: 0; background: #FFFFFF; font: 500 15px Inter, sans-serif; color: {{accent}}; text-align: left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="margin: 0 5px"><path d="M12 5v14M5 12h14"></path></svg>Use “net” as a new service</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 14px">
      <h2 style="margin: 0; display: flex; align-items: center; gap: 10px; font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: 17px"><span style="width: 24px; height: 24px; border-radius: 12px; background: #14171C; color: #FFFFFF; font: 700 13px Inter, sans-serif; display: flex; align-items: center; justify-content: center">2</span>Payment</h2>
      <div style="display: flex; gap: 10px">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
          <label for="amount" style="font-size: 13px; font-weight: 500; color: #5B6370">Amount</label>
          <input id="amount" class="num" value="12,99" inputmode="decimal" style="height: 48px; box-sizing: border-box; border: 1px solid #E3E6EA; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font: 600 18px Inter, sans-serif; color: #14171C">
        </div>
        <div style="width: 110px; display: flex; flex-direction: column; gap: 6px">
          <label for="currency" style="font-size: 13px; font-weight: 500; color: #5B6370">Currency</label>
          <button id="currency" type="button" style="height: 48px; border: 1px solid #E3E6EA; border-radius: 12px; background: #FFFFFF; font: 600 16px Inter, sans-serif; color: #14171C; display: flex; align-items: center; justify-content: space-between; padding: 0 12px">EUR<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6370" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
        </div>
      </div>
      <span class="num" style="font-size: 13px; color: #5B6370; margin-top: -6px">Saved as €12.99</span>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 500; color: #5B6370">Billing period</span>
        <div role="radiogroup" aria-label="Billing period" style="display: flex; background: #EEF0F3; border-radius: 12px; padding: 4px; gap: 4px">
          <button type="button" role="radio" aria-checked="false" style="flex: 1; height: 40px; border: 0; border-radius: 9px; background: transparent; font: 500 15px Inter, sans-serif; color: #14171C">Week</button>
          <button type="button" role="radio" aria-checked="true" style="flex: 1; height: 40px; border: 0; border-radius: 9px; background: #FFFFFF; font: 600 15px Inter, sans-serif; color: #14171C; box-shadow: 0 1px 2px rgba(20,23,28,0.08)">Month</button>
          <button type="button" role="radio" aria-checked="false" style="flex: 1; height: 40px; border: 0; border-radius: 9px; background: transparent; font: 500 15px Inter, sans-serif; color: #14171C">Year</button>
        </div>
      </div>
      <div style="display: flex; gap: 10px">
        <div style="width: 110px; display: flex; flex-direction: column; gap: 6px">
          <label for="every" style="font-size: 13px; font-weight: 500; color: #5B6370">Every</label>
          <input id="every" class="num" value="1" inputmode="numeric" style="height: 48px; box-sizing: border-box; border: 1px solid #E3E6EA; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font: 400 16px Inter, sans-serif; color: #14171C">
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
          <label for="first" style="font-size: 13px; font-weight: 500; color: #5B6370">First payment</label>
          <input id="first" class="num" value="2026-11-05" style="height: 48px; box-sizing: border-box; border: 1px solid #E3E6EA; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font: 400 16px Inter, sans-serif; color: #14171C">
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="category" style="font-size: 13px; font-weight: 500; color: #5B6370">Category</label>
        <button id="category" type="button" style="height: 48px; border: 1px solid #E3E6EA; border-radius: 12px; background: #FFFFFF; font: 400 16px Inter, sans-serif; color: #14171C; display: flex; align-items: center; justify-content: space-between; padding: 0 14px">Video Streaming<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6370" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="notes" style="font-size: 13px; font-weight: 500; color: #5B6370">Notes</label>
        <textarea id="notes" rows="2" style="box-sizing: border-box; border: 1px solid #E3E6EA; border-radius: 12px; background: #FFFFFF; padding: 12px 14px; font: 400 16px Inter, sans-serif; color: #14171C; resize: none">Family plan, shared with Max</textarea>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; display: flex; align-items: center; gap: 10px; font-family: Manrope, Inter, sans-serif; font-weight: 700; font-size: 17px"><span style="width: 24px; height: 24px; border-radius: 12px; background: #EEF0F3; color: #14171C; font: 700 13px Inter, sans-serif; display: flex; align-items: center; justify-content: center">3</span>Reminders <span style="font: 400 14px Inter, sans-serif; color: #5B6370">optional</span></h2>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #FFFFFF; border-radius: 14px; padding: 12px 14px">
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">Custom reminders</span><span style="font-size: 13px; color: #5B6370">Default: 1 day before at 09:00 · Push, In-app</span></div>
        <button type="button" role="switch" aria-checked="false" aria-label="Custom reminders for this subscription" style="width: 52px; height: 32px; border: 0; border-radius: 16px; background: #D5D9DF; padding: 3px; display: flex; flex: none"><span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(20,23,28,0.2)"></span></button>
      </div>
    </section>
  </form>

  <div style="padding: 12px 20px 28px; background: #FFFFFF; border-top: 1px solid #E3E6EA">
    <button type="button" style="width: 100%; height: 52px; border: 0; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font: 600 16px Inter, sans-serif">Save subscription</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B7A57","options":["#0B7A57","#2F5BD3","#C2410C","#14171C"]},"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0B7A57' };
  }
}
</script>
</body>
</html>
